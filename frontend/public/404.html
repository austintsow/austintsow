<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>gloria's stuff!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="gloria's stuff!">

    <!-- Link preview for deep links. GitHub Pages serves this file for every path
         that isn't a real file, and every deep route on this site lives under
         /gloria (/gloria/fall, /gloria/saturday, /gloria/archive, ...), so the
         gloria preview is the right default here. /gloria itself is served by the
         static stub at /gloria/index.html, and / is served by the app's index.html. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="austin tsow">
    <meta property="og:title" content="gloria's stuff!">
    <meta property="og:description" content="gloria's stuff!">
    <meta property="og:url" content="https://austintsow.com/gloria">
    <meta property="og:image" content="https://austintsow.com/gloria-og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="gloria's stuff!">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="gloria's stuff!">
    <meta name="twitter:description" content="gloria's stuff!">
    <meta name="twitter:image" content="https://austintsow.com/gloria-og.png">
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://austintsow.com/about becomes https://austintsow.com/?/about
      
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
